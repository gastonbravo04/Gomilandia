<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Acceso Administrador – Gomilandia</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍬</text></svg>"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800;900&family=Pacifico&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/css/styles.css"/>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: radial-gradient(circle at 10% 20%, rgba(255, 77, 141, 0.18) 0%, transparent 40%),
                  radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.15) 0%, transparent 40%),
                  #FFF5F9;
    }
    .login-card {
      background: #FFFFFF;
      border-radius: 28px;
      padding: 44px 36px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(233, 30, 140, 0.15);
      border: 2px solid var(--pk-border);
      text-align: center;
      position: relative;
    }
    .login-logo {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 3px solid var(--pk-main);
      box-shadow: 0 6px 18px var(--pk-glow);
      margin-bottom: 16px;
      object-fit: cover;
    }
    .login-title {
      font-family: var(--font-display);
      font-size: 2rem;
      color: var(--pk-deep);
      margin-bottom: 6px;
    }
    .login-subtitle {
      color: var(--gy-text);
      font-size: 0.92rem;
      margin-bottom: 28px;
    }
    .login-form-group {
      text-align: left;
      margin-bottom: 18px;
    }
    .login-form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--dk-text);
      margin-bottom: 6px;
    }
    .login-input {
      width: 100%;
      border: 2px solid var(--pk-border);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 1rem;
      outline: none;
      transition: all 0.2s;
    }
    .login-input:focus {
      border-color: var(--pk-deep);
      box-shadow: 0 0 0 3px rgba(233, 30, 140, 0.15);
    }
    .btn-login {
      width: 100%;
      background: linear-gradient(135deg, var(--pk-deep), var(--pk-main));
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 15px;
      font-weight: 800;
      font-size: 1.05rem;
      cursor: pointer;
      box-shadow: 0 6px 20px var(--pk-glow);
      transition: all 0.2s;
      margin-top: 10px;
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 26px rgba(233, 30, 140, 0.4);
    }
    .login-error {
      background: #FEE2E2;
      color: #DC2626;
      border: 1px solid #FCA5A5;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 700;
      margin-bottom: 18px;
    }
    .back-link {
      display: inline-block;
      margin-top: 22px;
      color: var(--gy-text);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 700;
      transition: color 0.2s;
    }
    .back-link:hover {
      color: var(--pk-deep);
    }
  </style>
</head>
<body>

  <main class="login-card">
    <img src="/static/img/logo.jpg" alt="Logo Gomilandia" class="login-logo"/>
    <h1 class="login-title">Gomilandia</h1>
    <p class="login-subtitle">Apartado Exclusivo para Administrador</p>

    {% if error %}
    <div class="login-error">{{ error }} ❌</div>
    {% endif %}

    <form method="POST" action="/admin/login">
      <div class="login-form-group">
        <label for="user">Usuario</label>
        <input type="text" id="user" name="user" class="login-input" placeholder="Ingresá tu usuario" required autofocus/>
      </div>

      <div class="login-form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" class="login-input" placeholder="••••••••" required/>
      </div>

      <button type="submit" class="btn-login">Ingresar al Panel 🚀</button>
    </form>

    <a href="/" class="back-link">← Volver a la Tienda Pública</a>
  </main>

</body>
</html>
